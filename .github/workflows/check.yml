# Команда «готово» на кожен push у main і на кожен pull request: та сама, що й локально.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: riskua
          POSTGRES_USER: riskua
          POSTGRES_PASSWORD: riskua
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riskua -d riskua"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RISKUA_TEST_DATABASE_URL: postgresql://riskua:riskua@localhost:5432/riskua
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python scripts/check.py --all
